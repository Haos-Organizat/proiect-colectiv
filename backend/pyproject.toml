[project]
name = "proiect-colectiv"
version = "0.1.0"
description = "Flask Backend"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "api"]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
